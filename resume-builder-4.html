<style>
:root{--bg:#f4f6fb;--panel:#fff;--panel2:#f8f9fc;--text:#101828;--muted:#667085;--line:#e4e7ec;--brand:#4f46e5;--brand2:#4338ca;--success:#12b76a;--danger:#d92d20;--shadow:0 14px 45px rgba(16,24,40,.08);--r:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}

.brand{display:flex;align-items:center;gap:10px;font-family:"Space Grotesk";font-weight:700;font-size:20px}.brandmark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#4f46e5,#06b6d4);display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 7px 18px rgba(79,70,229,.25)}
.top-center{margin:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.save-dot{width:7px;height:7px;border-radius:50%;background:var(--success)}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{border-color:#c8cdd5;background:#f8fafc}.btn-primary{background:linear-gradient(135deg,#4f46e5,#2563eb);border-color:transparent;color:#fff;box-shadow:0 9px 24px rgba(79,70,229,.25)}.btn-primary:hover{filter:brightness(.98);transform:translateY(-1px)}.btn-icon{width:40px;height:40px;padding:0}.btn-danger{color:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}
.app{max-width:1540px;margin:auto;padding:16px;display:grid;grid-template-columns:236px minmax(390px,500px) minmax(520px,1fr);gap:16px;min-height:calc(100vh - 66px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sidebar{height:max-content;position:sticky;top:82px;padding:14px}.sidebar-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted);padding:6px 9px 10px}.nav-list{display:grid;gap:3px}.nav-item{width:100%;border:0;background:transparent;border-radius:11px;padding:10px 9px;display:flex;align-items:center;gap:10px;color:#475467;text-align:left;font-weight:650;font-size:13px}.nav-item:hover{background:#f7f8fc}.nav-item.active{background:#eef2ff;color:var(--brand)}.nav-icon{width:27px;height:27px;border-radius:8px;background:#f2f4f7;display:grid;place-items:center;font-size:12px}.nav-item.active .nav-icon{background:#e0e7ff}.progress{border-top:1px solid var(--line);margin:14px 8px 0;padding-top:14px}.progress-head{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:7px}.progress-bar{height:7px;background:#edf0f5;border-radius:99px;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#4f46e5,#06b6d4);transition:width .3s}
.editor{padding:24px;min-width:0}.editor-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:20px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--brand);font-weight:800}.editor h1{font-family:"Space Grotesk";font-size:25px;line-height:1.15;margin:5px 0}.editor-sub{font-size:13px;color:var(--muted);margin:0}.section{display:none}.section.active{display:block;animation:sectionIn .18s ease}@keyframes sectionIn{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field-group{margin-bottom:14px}.field-group.full{grid-column:1/-1}.label{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:750;color:#344054;margin-bottom:6px}.label span{font-weight:500;color:#98a2b3}.field,.textarea,.select{width:100%;border:1px solid #d0d5dd;border-radius:11px;padding:11px 12px;background:#fff;color:var(--text);outline:0;transition:.15s}.textarea{resize:vertical;min-height:110px;line-height:1.55}.field:focus,.textarea:focus,.select:focus{border-color:#8b83f7;box-shadow:0 0 0 3px rgba(79,70,229,.1)}.hint{font-size:11px;color:var(--muted);margin-top:5px}.count{text-align:right}.section-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fcfcfd}.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.card-title{font-size:13px;font-weight:800}.card-actions{display:flex;gap:5px}.small-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:750}.small-btn:hover{background:#f8fafc}.add{width:100%;border:1px dashed #aeb5ef;background:#f8f8ff;color:var(--brand);padding:11px;border-radius:11px;font-weight:800}.add:hover{background:#f1f2ff}.check{display:flex;align-items:center;gap:8px;font-size:12px;color:#475467}.check input{accent-color:var(--brand)}
.photo-row{display:flex;align-items:center;gap:13px}.avatar{width:70px;height:70px;border-radius:15px;background:#f2f4f7;border:1px dashed #cfd4dc;display:grid;place-items:center;color:#98a2b3;overflow:hidden;flex:none;font-size:11px}.avatar img{width:100%;height:100%;object-fit:cover}
.template-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.template-card{border:2px solid var(--line);border-radius:13px;padding:9px;background:#fff;cursor:pointer}.template-card.active{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.08)}.template-thumb{height:108px;border-radius:8px;background:#f3f4f6;padding:10px;display:flex;gap:7px;overflow:hidden}.thumb-side{width:25%;background:#202938}.thumb-main{flex:1}.thumb-line{height:4px;background:#cbd5e1;border-radius:5px;margin:6px 0}.thumb-short{width:60%}.template-name{font-size:12px;font-weight:800;margin-top:8px}.colors{display:flex;flex-wrap:wrap;gap:10px}.color-dot{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d0d5dd}.color-dot.active{box-shadow:0 0 0 2px var(--brand)}
.nav-buttons{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.preview{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:#eef1f6}.preview-toolbar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px}.preview-label{font-weight:800;font-size:13px}.toolbar{display:flex;align-items:center;gap:6px}.zoom-value{font-size:12px;color:var(--muted);min-width:46px;text-align:center}.preview-scroll{flex:1;overflow:auto;padding:30px;display:flex;justify-content:center;align-items:flex-start}.paper-wrap{transform-origin:top center}.paper{width:794px;min-height:1123px;background:#fff;color:#172033;box-shadow:0 14px 44px rgba(16,24,40,.16);padding:58px 60px;position:relative;font-family:Arial,sans-serif}.paper h2{margin:0;font-size:31px;line-height:1.08;letter-spacing:-.03em}.paper .headline{font-size:14px;color:var(--accent);font-weight:700;margin-top:6px}.contact{font-size:10.5px;color:#667085;margin-top:9px;line-height:1.6}.resume-section{margin-top:23px}.resume-section h3{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);border-bottom:1px solid #dfe3e8;padding-bottom:6px;margin:0 0 11px;font-weight:800}.summary{font-size:10.5px;line-height:1.62;color:#475467;white-space:pre-line}.resume-entry{margin-bottom:13px}.entry-top{display:flex;justify-content:space-between;gap:16px;font-size:11px;font-weight:800}.entry-date{font-weight:600;color:#667085;white-space:nowrap}.entry-sub{font-size:10px;color:#667085;margin-top:2px}.entry-desc{font-size:10px;color:#475467;line-height:1.55;margin:5px 0 0;white-space:pre-line}.skills{display:flex;flex-wrap:wrap;gap:5px}.skill{font-size:9px;padding:4px 7px;border-radius:5px;background:#f2f4f7;color:#344054}.photo{width:74px;height:74px;border-radius:50%;object-fit:cover;position:absolute;right:60px;top:57px;border:3px solid #fff}.paper-modern .paper-head{border-left:4px solid var(--accent);padding-left:15px}.paper-classic{font-family:Georgia,serif}.paper-classic .paper-head{text-align:center;border-bottom:2px solid #222;padding-bottom:18px}.paper-classic .headline,.paper-classic .resume-section h3{color:#222}.paper-minimal{padding:64px 70px}.paper-minimal .resume-section h3{border:0;color:#98a2b3;padding:0}.paper-sidebar{padding:0}.paper-sidebar .side{width:215px;background:#172033;color:#fff;position:absolute;left:0;top:0;bottom:0;padding:58px 25px}.paper-sidebar .side h2{font-size:25px}.paper-sidebar .side .headline,.paper-sidebar .side .contact{color:#d0d5dd}.paper-sidebar .side h3{color:#a5b4fc;border:0}.paper-sidebar .main{margin-left:245px;padding:58px 45px 58px 20px}.paper-sidebar .main h3{color:var(--accent)}
.mobile-tabs{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;padding:12px 15px;border-radius:11px;box-shadow:var(--shadow);font-size:13px;z-index:300}.modal-backdrop{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:250;padding:18px}.modal-backdrop.open{display:flex}.modal{background:#fff;border-radius:18px;width:min(520px,100%);padding:22px;box-shadow:0 25px 80px rgba(0,0,0,.2)}.modal h2{font-family:"Space Grotesk";margin:0 0 8px}.modal p{color:var(--muted);font-size:13px;line-height:1.6}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:1120px){.app{grid-template-columns:210px minmax(330px,1fr)}.preview{grid-column:1/-1;min-height:720px}.sidebar{position:static}}
@media(max-width:760px){.topbar{height:58px;padding:0 12px}.top-center{display:none}.top-actions .secondary{display:none}.app{display:block;padding:0}.sidebar,.editor,.preview{border-radius:0;border-left:0;border-right:0;box-shadow:none}.sidebar{position:sticky;top:58px;z-index:90;padding:7px;border-bottom:1px solid var(--line)}.sidebar-label,.progress{display:none}.nav-list{display:flex;overflow:auto;gap:4px}.nav-item{white-space:nowrap;padding:8px 9px;font-size:11px;width:auto}.nav-icon{display:none}.editor{padding:17px}.editor h1{font-size:21px}.field-grid{grid-template-columns:1fr}.field-group.full{grid-column:auto}.preview{margin-top:10px}.preview-toolbar{position:sticky;top:0;z-index:10}.preview-scroll{padding:18px 8px;min-height:650px}.paper{width:794px;min-height:1123px}.preview .paper-wrap{transform:scale(.48);margin-bottom:-580px}.mobile-tabs{display:flex;position:sticky;bottom:0;z-index:110;background:#fff;border-top:1px solid var(--line)}.mobile-tabs button{flex:1;border:0;background:#fff;padding:13px;font-weight:800;color:var(--muted)}.mobile-tabs button.active{color:var(--brand)}.mobile-hidden{display:none!important}.template-grid{grid-template-columns:1fr 1fr}}
@media print{ @page{size:A4;margin:0} html,body{background:#fff!important} body.printing>*{display:none!important} body.printing #printRoot{display:block!important} #printRoot .paper{width:210mm!important;min-height:297mm!important;height:auto!important;box-shadow:none!important;margin:0!important;padding:15mm!important;transform:none!important} #printRoot{background:#fff!important} }
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="index.html"><span class="brandmark">R</span>ResumQR</a>
<div class="top-center"><span class="save-dot"></span><span id="saveText">Saved locally</span></div>
<div class="top-actions"><button class="btn secondary" id="newResume">New resume</button><button class="btn btn-primary" id="savePdf">Download PDF</button></div>
</header>

<main class="app">
<aside class="panel sidebar">
<div class="sidebar-label">Build your resume</div>
<nav class="nav-list" id="sectionNav"></nav>
<div class="progress"><div class="progress-head"><span>Completion</span><strong id="progressText">0%</strong></div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
</aside>

<section class="panel editor" id="editor">
<div class="editor-head"><div><div class="eyebrow">Free Resume Builder</div><h1 id="editorTitle">Personal information</h1><p class="editor-sub" id="editorSub">Start with the details employers use to identify you.</p></div></div>

<div class="section active" data-section="personal">
<div class="field-grid">
<div class="field-group full"><label class="label">Full name *</label><input class="field" id="name" placeholder="e.g. John Doe"></div>
<div class="field-group"><label class="label">Professional title</label><input class="field" id="headline" placeholder="e.g. Electrician"></div>
<div class="field-group"><label class="label">Email</label><input class="field" id="email" type="email" placeholder="you@example.com"></div>
<div class="field-group"><label class="label">Phone</label><input class="field" id="phone" placeholder="+966 5X XXX XXXX"></div>
<div class="field-group"><label class="label">Location</label><input class="field" id="location" placeholder="Jeddah, Saudi Arabia"></div>
<div class="field-group"><label class="label">Website / LinkedIn</label><input class="field" id="website" placeholder="linkedin.com/in/yourname"></div>
<div class="field-group full"><label class="label">Profile photo <span>Optional</span></label><div class="photo-row"><div class="avatar" id="avatar">Photo</div><input class="field" id="photo" type="file" accept="image/png,image/jpeg,image/webp"></div></div>
</div>
</div>

<div class="section" data-section="summary">
<div class="field-group"><label class="label">Professional summary</label><textarea class="textarea" id="summary" maxlength="800" placeholder="Write 2–4 concise sentences about your experience, strengths and career direction."></textarea><div class="hint count"><span id="summaryCount">0</span>/800</div></div>
</div>

<div class="section" data-section="experience">
<div id="experienceList"></div><button class="add" id="addExperience">+ Add work experience</button>
</div>

<div class="section" data-section="education">
<div id="educationList"></div><button class="add" id="addEducation">+ Add education</button>
</div>

<div class="section" data-section="skills">
<div class="field-group"><label class="label">Skills</label><textarea class="textarea" id="skills" placeholder="Customer service, Microsoft Office, Driving, Plumbing, Sales"></textarea><div class="hint">Separate skills with commas.</div></div>
</div>

<div class="section" data-section="projects">
<div id="projectsList"></div><button class="add" id="addProject">+ Add project</button>
</div>

<div class="section" data-section="certifications">
<div id="certificationsList"></div><button class="add" id="addCertification">+ Add certification</button>
</div>

<div class="section" data-section="languages">
<div id="languagesList"></div><button class="add" id="addLanguage">+ Add language</button>
</div>

<div class="section" data-section="awards">
<div id="awardsList"></div><button class="add" id="addAward">+ Add award</button>
</div>

<div class="section" data-section="design">
<div class="field-group"><label class="label">Resume template</label><div class="template-grid" id="templates">
<div class="template-card active" data-template="modern"><div class="template-thumb"><div class="thumb-main"><div class="thumb-line" style="width:70%"></div><div class="thumb-line thumb-short"></div><div class="thumb-line"></div><div class="thumb-line"></div></div></div><div class="template-name">Modern</div></div>
<div class="template-card" data-template="classic"><div class="template-thumb"><div class="thumb-main"><div class="thumb-line" style="width:80%"></div><div class="thumb-line thumb-short"></div><div class="thumb-line"></div><div class="thumb-line"></div></div></div><div class="template-name">Classic</div></div>
<div class="template-card" data-template="minimal"><div class="template-thumb"><div class="thumb-main"><div class="thumb-line" style="width:55%"></div><div class="thumb-line thumb-short"></div><div class="thumb-line"></div><div class="thumb-line"></div></div></div><div class="template-name">Minimal</div></div>
<div class="template-card" data-template="sidebar"><div class="template-thumb"><div class="thumb-side"></div><div class="thumb-main"><div class="thumb-line"></div><div class="thumb-line thumb-short"></div><div class="thumb-line"></div></div></div><div class="template-name">Executive</div></div>
</div></div>
<div class="field-group"><label class="label">Accent color</label><div class="colors" id="colors"></div></div>
<div class="field-grid">
<div class="field-group"><label class="label">Resume font</label><select class="select" id="font"><option value="Arial,sans-serif">Arial</option><option value="Inter,Arial,sans-serif">Inter</option><option value="Georgia,serif">Georgia</option></select></div>
<div class="field-group"><label class="label">Page size</label><select class="select" id="pageSize"><option value="A4">A4</option><option value="Letter">Letter</option></select></div>
</div>
</div>

<div class="nav-buttons"><button class="btn" id="prev">← Previous</button><button class="btn btn-primary" id="next">Next →</button></div>
</section>

<section class="panel preview" id="previewPanel">
<div class="preview-toolbar"><span class="preview-label">Live A4 preview</span><div class="toolbar"><button class="btn btn-icon" id="zoomOut">−</button><span class="zoom-value" id="zoom">70%</span><button class="btn btn-icon" id="zoomIn">+</button></div></div>
<div class="preview-scroll" id="previewScroll"><div class="paper-wrap" id="paperWrap"></div></div>
</section>
</main>

<div class="mobile-tabs"><button class="active" id="editTab">Edit resume</button><button id="previewTab">Preview</button></div>
<div id="printRoot" style="display:none"></div>
<div id="toastRoot"></div>

<script>
(()=>{"use strict";
const KEY="resumqr-resume-v3";
const sections=[
["personal","Personal","P","Your contact details and profile photo."],
["summary","Summary","S","A concise introduction for employers."],
["experience","Experience","E","Show your work history and achievements."],
["education","Education","D","Add qualifications, schools and dates."],
["skills","Skills","K","List your strongest job-relevant skills."],
["projects","Projects","P","Highlight useful projects and practical work."],
["certifications","Certifications","C","Add licenses, certificates and training."],
["languages","Languages","L","Show languages and proficiency."],
["awards","Awards","A","Add awards, honors or recognition."],
["design","Design","✦","Choose your visual style and color."]
];
const subtitles=Object.fromEntries(sections.map(x=>[x[0],x[3]]));
let current=0,zoom=.7,photoData="";
let data={name:"",headline:"",email:"",phone:"",location:"",website:"",summary:"",skills:"",experience:[],education:[],projects:[],certifications:[],languages:[],awards:[],template:"modern",accent:"#4F46E5",font:"Arial,sans-serif",pageSize:"A4"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const txt=(s)=>String(s??"").trim();
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;$("toastRoot").appendChild(t);setTimeout(()=>t.remove(),2400)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({...data,photo:photoData}));$("saveText").textContent="Saved locally";}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){data={...data,...x};photoData=x.photo||""}}catch(e){}}
function nav(){const root=$("sectionNav");root.textContent="";sections.forEach((s,i)=>{const b=document.createElement("button");b.className="nav-item"+(i===current?" active":"");b.type="button";const icon=document.createElement("span");icon.className="nav-icon";icon.textContent=s[2];const label=document.createElement("span");label.textContent=s[1];b.append(icon,label);b.onclick=()=>go(i);root.appendChild(b)})}
function go(i){current=Math.max(0,Math.min(sections.length-1,i));document.querySelectorAll(".section").forEach((s,n)=>s.classList.toggle("active",n===current));$("editorTitle").textContent=sections[current][1];$("editorSub").textContent=subtitles[sections[current][0]];$("prev").disabled=current===0;$("next").textContent=current===sections.length-1?"Done ✓":"Next →";nav();window.scrollTo({top:0,behavior:"smooth"})}
function bindBasic(){["name","headline","email","phone","location","website","summary","skills"].forEach(id=>$(id).addEventListener("input",()=>{data[id]=$(id).value;if(id==="summary")$("summaryCount").textContent=data.summary.length;render();save();progress()}));$("font").addEventListener("change",()=>{data.font=$("font").value;render();save()});$("pageSize").addEventListener("change",()=>{data.pageSize=$("pageSize").value;render();save()})}
function fillBasic(){["name","headline","email","phone","location","website","summary","skills"].forEach(id=>$(id).value=data[id]||"");$("font").value=data.font;$("pageSize").value=data.pageSize;$("summaryCount").textContent=data.summary.length;$("avatar").textContent="Photo";if(photoData){const img=document.createElement("img");img.src=photoData;img.alt="";$("avatar").textContent="";$("avatar").appendChild(img)}renderColors();renderLists()}
function renderColors(){const colors=["#4F46E5","#2563EB","#0891B2","#0F766E","#B42318","#7A5AF8","#344054","#111827"];const r=$("colors");r.textContent="";colors.forEach(c=>{const b=document.createElement("button");b.type="button";b.className="color-dot"+(c===data.accent?" active":"");b.style.background=c;b.setAttribute("aria-label","Use "+c);b.onclick=()=>{data.accent=c;renderColors();render();save()};r.appendChild(b)})}
function field(label,value,key){const wrap=document.createElement("div");wrap.className="field-group";const l=document.createElement("label");l.className="label";l.textContent=label;const input=document.createElement("input");input.className="field";input.value=value||"";input.dataset.key=key;wrap.append(l,input);return wrap}
function area(label,value,key){const wrap=document.createElement("div");wrap.className="field-group full";const l=document.createElement("label");l.className="label";l.textContent=label;const input=document.createElement("textarea");input.className="textarea";input.value=value||"";input.dataset.key=key;wrap.append(l,input);return wrap}
function card(rootId,type,title,fields,extra){const root=$(rootId);root.textContent="";data[type].forEach((item,i)=>{const c=document.createElement("div");c.className="section-card";const head=document.createElement("div");head.className="card-head";const h=document.createElement("span");h.className="card-title";h.textContent=title+" "+(i+1);const acts=document.createElement("div");acts.className="card-actions";const up=mini("↑","Move up"),down=mini("↓","Move down"),del=mini("Delete","Delete");del.classList.add("btn-danger");acts.append(up,down,del);head.append(h,acts);const grid=document.createElement("div");grid.className="field-grid";fields.forEach(f=>grid.append(f.kind==="area"?area(f.label,item[f.key],f.key):field(f.label,item[f.key],f.key)));c.append(head,grid);if(extra){const ex=extra(item);if(ex)c.append(ex)}c.querySelectorAll("input[data-key],textarea[data-key]").forEach(el=>el.addEventListener("input",()=>{item[el.dataset.key]=el.value;render();save();progress()}));del.onclick=()=>{data[type].splice(i,1);renderLists();render();save();progress()};up.onclick=()=>{if(i>0){[data[type][i-1],data[type][i]]=[data[type][i],data[type][i-1]];renderLists();render();save()}};down.onclick=()=>{if(i<data[type].length-1){[data[type][i+1],data[type][i]]=[data[type][i],data[type][i+1]];renderLists();render();save()}};root.appendChild(c)})}
function mini(label,title){const b=document.createElement("button");b.type="button";b.className="small-btn";b.textContent=label;b.title=title;return b}
function renderLists(){
card("experienceList","experience","Experience",[
{label:"Job title",key:"title"},{label:"Company",key:"company"},{label:"Location",key:"location"},{label:"Dates",key:"dates"},{label:"Description / achievements",key:"description",kind:"area"}],
item=>{const w=document.createElement("label");w.className="check";const c=document.createElement("input");c.type="checkbox";c.checked=!!item.current;c.onchange=()=>{item.current=c.checked;render();save()};w.append(c,document.createTextNode("I currently work here"));return w});
card("educationList","education","Education",[
{label:"Degree / qualification",key:"degree"},{label:"School / institution",key:"school"},{label:"Location",key:"location"},{label:"Dates",key:"dates"}
]);
card("projectsList","projects","Project",[{label:"Project name",key:"title"},{label:"Link",key:"link"},{label:"Description",key:"description",kind:"area"}]);
card("certificationsList","certifications","Certification",[{label:"Certificate / license",key:"title"},{label:"Issuer",key:"issuer"},{label:"Year",key:"year"}]);
card("languagesList","languages","Language",[{label:"Language",key:"name"},{label:"Level",key:"level"}]);
card("awardsList","awards","Award",[{label:"Award / recognition",key:"title"},{label:"Issuer",key:"issuer"},{label:"Year",key:"year"}]);
}
function add(type,obj){data[type].push(obj);renderLists();render();save();progress()}
function escLine(s){return esc(s).replace(/\n/g,"<br>")}
function section(title,html){return html?'<section class="resume-section"><h3>'+title+"</h3>"+html+"</section>":""}
function entry(x,sub){return '<div class="resume-entry"><div class="entry-top"><span>'+esc(x.title||"")+'</span><span class="entry-date">'+esc(x.dates||"")+'</span></div><div class="entry-sub">'+esc(sub||"")+'</div><p class="entry-desc">'+escLine(x.description||"")+"</p></div>"}
function render(){
const exp=data.experience.map(x=>entry(x,(x.company||"")+(x.location?" · "+x.location:""))).join("");
const edu=data.education.map(x=>'<div class="resume-entry"><div class="entry-top"><span>'+esc(x.degree||"")+'</span><span class="entry-date">'+esc(x.dates||"")+'</span></div><div class="entry-sub">'+esc((x.school||"")+(x.location?" · "+x.location:""))+"</div></div>").join("");
const proj=data.projects.map(x=>'<div class="resume-entry"><div class="entry-top"><span>'+esc(x.title)+'</span><span class="entry-date">'+esc(x.link)+'</span></div><p class="entry-desc">'+escLine(x.description)+'</p></div>').join("");
const cert=data.certifications.map(x=>'<div class="resume-entry"><div class="entry-top"><span>'+esc(x.title)+'</span><span class="entry-date">'+esc(x.year)+'</span></div><div class="entry-sub">'+esc(x.issuer)+'</div></div>').join("");
const lang=data.languages.map(x=>'<div class="resume-entry"><div class="entry-top"><span>'+esc(x.name)+'</span><span class="entry-date">'+esc(x.level)+'</span></div></div>').join("");
const awards=data.awards.map(x=>'<div class="resume-entry"><div class="entry-top"><span>'+esc(x.title)+'</span><span class="entry-date">'+esc(x.year)+'</span></div><div class="entry-sub">'+esc(x.issuer)+'</div></div>').join("");
const skills=data.skills.split(",").map(x=>x.trim()).filter(Boolean).map(x=>'<span class="skill">'+esc(x)+"</span>").join("");
let head='<div class="paper-head">'+(photoData?'<img class="photo" src="'+photoData+'" alt="">':"")+'<h2>'+esc(data.name||"Your Name")+'</h2><div class="headline">'+esc(data.headline||"Professional Title")+'</div><div class="contact">'+[data.email,data.phone,data.location,data.website].filter(Boolean).map(esc).join(" · ")+"</div></div>";
let content=section("Profile",'<div class="summary">'+escLine(data.summary||"")+'</div>')+section("Experience",exp)+section("Education",edu)+section("Skills",skills?'<div class="skills">'+skills+"</div>":"")+section("Projects",proj)+section("Certifications",cert)+section("Languages",lang)+section("Awards",awards);
let paper='<div class="paper paper-'+data.template+'" style="--accent:'+data.accent+'">'+(data.template==="sidebar"?'<div class="side">'+head+'</div><div class="main">'+content+"</div>":head+content)+"</div>";
$("paperWrap").innerHTML=paper;$("paperWrap").style.transform="scale("+zoom+")";$("zoom").textContent=Math.round(zoom*100)+"%";
}
function progress(){const checks=[data.name,data.headline,data.email,data.phone,data.location,data.summary,data.experience.length,data.education.length,data.skills,data.projects.length+data.certifications.length+data.languages.length+data.awards.length];const score=Math.round(checks.filter(Boolean).length/checks.length*100);$("progressFill").style.width=score+"%";$("progressText").textContent=score+"%"}
document.querySelectorAll(".template-card").forEach(c=>c.onclick=()=>{data.template=c.dataset.template;document.querySelectorAll(".template-card").forEach(x=>x.classList.toggle("active",x===c));render();save()});
$("addExperience").onclick=()=>add("experience",{title:"",company:"",location:"",dates:"",description:"",current:false});
$("addEducation").onclick=()=>add("education",{degree:"",school:"",location:"",dates:""});
$("addProject").onclick=()=>add("projects",{title:"",link:"",description:""});
$("addCertification").onclick=()=>add("certifications",{title:"",issuer:"",year:""});
$("addLanguage").onclick=()=>add("languages",{name:"",level:""});
$("addAward").onclick=()=>add("awards",{title:"",issuer:"",year:""});
$("prev").onclick=()=>go(current-1);$("next").onclick=()=>current===sections.length-1?toast("Your resume is ready to download."):go(current+1);
$("zoomIn").onclick=()=>{zoom=Math.min(1,.05+zoom);render()};$("zoomOut").onclick=()=>{zoom=Math.max(.45,zoom-.05);render()};
$("newResume").onclick=()=>{if(confirm("Start a new resume? Your saved draft will be cleared.")){localStorage.removeItem(KEY);location.reload()}};
$("photo").onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith("image/")||f.size>4*1024*1024){toast("Please choose an image under 4 MB.");return}const r=new FileReader();r.onload=()=>{photoData=r.result;fillBasic();render();save()};r.readAsDataURL(f)};
$("editTab").onclick=()=>{$("editor").classList.remove("mobile-hidden");$("previewPanel").classList.add("mobile-hidden");$("editTab").classList.add("active");$("previewTab").classList.remove("active")};
$("previewTab").onclick=()=>{$("editor").classList.add("mobile-hidden");$("previewPanel").classList.remove("mobile-hidden");$("previewTab").classList.add("active");$("editTab").classList.remove("active")};

function loadPdfEngine(){
if(window.jspdf?.jsPDF)return Promise.resolve(window.jspdf.jsPDF);
return new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js";s.onload=()=>window.jspdf?.jsPDF?resolve(window.jspdf.jsPDF):reject();s.onerror=reject;document.head.appendChild(s)})
}
function pdfText(doc,text,x,y,maxWidth,size,bold=false,color=[23,32,51]){
doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(size);doc.setTextColor(...color);const lines=doc.splitTextToSize(String(text||""),maxWidth);doc.text(lines,x,y);return y+lines.length*(size*.36)}
async function downloadPDF(){
const btn=$("savePdf");const old=btn.innerHTML;btn.disabled=true;btn.textContent="Preparing PDF…";render();
try{
const JsPDF=await loadPdfEngine();const pageW=data.pageSize==="Letter"?215.9:210,pageH=data.pageSize==="Letter"?279.4:297;
const doc=new JsPDF({unit:"mm",format:data.pageSize==="Letter"?"letter":"a4",orientation:"portrait"});
const m=15,contentW=pageW-m*2,accent=data.accent;
let y=18;
const addPageIfNeeded=(needed=12)=>{if(y+needed>pageH-14){doc.addPage();y=18;return true}return false};
if(data.template==="sidebar"){doc.setFillColor(23,32,51);doc.rect(0,0,58,pageH,"F");}
const left=data.template==="sidebar"?66:m;
const width=data.template==="sidebar"?pageW-78:contentW;
if(photoData){try{doc.addImage(photoData,"JPEG",pageW-m-24,14,24,24)}catch(e){}}
doc.setTextColor(16,24,40);doc.setFont("helvetica","bold");doc.setFontSize(24);doc.text(data.name||"Your Name",left,y);
y+=8;doc.setFontSize(11);doc.setTextColor(...hexRgb(accent));doc.setFont("helvetica","bold");doc.text(data.headline||"Professional Title",left,y);y+=6;
const contact=[data.email,data.phone,data.location,data.website].filter(Boolean).join("  •  ");y=pdfText(doc,contact,left,y,width,8,false,[102,112,133]);y+=4;
const drawSection=(title,body,opts={})=>{
if(!body)return;y+=5;addPageIfNeeded(20);doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...hexRgb(accent));doc.text(title.toUpperCase(),left,y);doc.setDrawColor(...hexRgb(accent));doc.setLineWidth(.35);doc.line(left,y+2,left+width,y+2);y+=8;
body();
};
drawSection("Profile",()=>{y=pdfText(doc,data.summary,left,y,width,9,false,[71,84,103])});
drawSection("Experience",()=>{data.experience.forEach(x=>{addPageIfNeeded(25);doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(23,32,51);doc.text(x.title||"",left,y);doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(102,112,133);if(x.dates)doc.text(x.dates,pageW-m,y,{align:"right"});y+=4.5;doc.text([x.company,x.location].filter(Boolean).join("  •  "),left,y);y+=4.5;y=pdfText(doc,x.description,left,y,width,8.2,false,[71,84,103])+4})});
drawSection("Education",()=>{data.education.forEach(x=>{addPageIfNeeded(18);doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(23,32,51);doc.text(x.degree||"",left,y);if(x.dates){doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(102,112,133);doc.text(x.dates,pageW-m,y,{align:"right"})}y+=4.5;y=pdfText(doc,[x.school,x.location].filter(Boolean).join("  •  "),left,y,width,8.2,false,[102,112,133])+3})});
drawSection("Skills",()=>{y=pdfText(doc,data.skills,left,y,width,8.5,false,[52,64,84])});
drawSection("Projects",()=>{data.projects.forEach(x=>{addPageIfNeeded(20);doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(23,32,51);doc.text(x.title||"",left,y);if(x.link){doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(102,112,133);doc.text(x.link,pageW-m,y,{align:"right"})}y+=5;y=pdfText(doc,x.description,left,y,width,8.2,false,[71,84,103])+3})});
drawSection("Certifications",()=>{data.certifications.forEach(x=>{addPageIfNeeded(15);doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(23,32,51);doc.text(x.title||"",left,y);doc.setFont("helvetica","normal");doc.setTextColor(102,112,133);if(x.year)doc.text(x.year,pageW-m,y,{align:"right"});y+=4.5;y=pdfText(doc,x.issuer,left,y,width,8,false,[102,112,133])+2})});
drawSection("Languages",()=>{data.languages.forEach(x=>{addPageIfNeeded(12);doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(23,32,51);doc.text(x.name||"",left,y);doc.setFont("helvetica","normal");doc.setTextColor(102,112,133);doc.text(x.level||"",pageW-m,y,{align:"right"});y+=5})});
drawSection("Awards",()=>{data.awards.forEach(x=>{addPageIfNeeded(15);doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(23,32,51);doc.text(x.title||"",left,y);doc.setFont("helvetica","normal");doc.setTextColor(102,112,133);if(x.year)doc.text(x.year,pageW-m,y,{align:"right"});y+=4.5;y=pdfText(doc,x.issuer,left,y,width,8,false,[102,112,133])+2})});
const filename="resume-"+(data.name||"your-name").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+".pdf";
doc.save(filename);toast("PDF downloaded successfully.");
}catch(e){toast("PDF engine could not load. Opening print-to-PDF instead.");printFallback()}
finally{btn.disabled=false;btn.innerHTML=old}
}
function hexRgb(hex){const h=hex.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function printFallback(){const root=$("printRoot");root.innerHTML=$("paperWrap").innerHTML;root.style.display="block";document.body.classList.add("printing");window.print();setTimeout(()=>{document.body.classList.remove("printing");root.style.display="none";root.textContent=""},1000)}
$("savePdf").onclick=downloadPDF;
load();bindBasic();fillBasic();nav();render();progress();
})();
</script>
</body>
</html>
